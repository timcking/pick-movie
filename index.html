<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pick a Movie</title>
  <style>
    body { font-family: system-ui, sans-serif; display: grid; place-content: center;
           min-height: 100vh; margin: 0; gap: 1.5rem; text-align: center;
           background: #241b2e; color: #f5e9ff; }
    #title { font-size: clamp(1.5rem, 6vw, 3rem); font-weight: 600; min-height: 1.2em; cursor: pointer; }
    #title:hover { text-decoration: underline; }
    button { font-size: 1.1rem; padding: 0.75rem 2rem; width: 300px; border: 0; border-radius: 999px;
             background: #b8a4d9; color: #241b2e; cursor: pointer; margin: 0 auto; }
    button:hover { background: #cbb8e8; }
    #count { color: #9c8bb4; font-size: 0.9rem; }
  </style>
</head>
<body>
  <div id="title">…</div>
  <button id="pick">Pick a Random Movie</button>
  <div id="count"></div>

  <script>
    const OMDB_API_KEY = 'ef5b7e20';

    const titleEl = document.querySelector('#title');
    const countEl = document.querySelector('#count');
    let titles = [];
    let currentTitle = null;

    function pick() {
      if (!titles.length) return;
      currentTitle = titles[Math.floor(Math.random() * titles.length)];
      titleEl.textContent = currentTitle;
    }

    function searchImdb() {
      if (!currentTitle) return;
      const fallbackUrl = `https://www.imdb.com/find/?q=${encodeURIComponent(currentTitle)}`;

      fetch(`https://www.omdbapi.com/?apikey=${OMDB_API_KEY}&t=${encodeURIComponent(currentTitle)}`)
        .then(r => r.json())
        .then(data => {
          window.location.href = data.Response === 'True' && data.imdbID
            ? `https://www.imdb.com/title/${data.imdbID}/`
            : fallbackUrl;
        })
        .catch(() => { window.location.href = fallbackUrl; });
    }

    fetch('watchlist.json', { cache: 'no-cache' })
      .then(r => r.json())
      .then(data => {
        titles = data.watchlist.map(e => e.title);
        countEl.textContent = `${titles.length} titles`;
        pick();
      })
      .catch(() => { titleEl.textContent = 'Could not load the watchlist.'; });

    document.querySelector('#pick').addEventListener('click', pick);
    titleEl.addEventListener('click', searchImdb);
  </script>
</body>
</html>
